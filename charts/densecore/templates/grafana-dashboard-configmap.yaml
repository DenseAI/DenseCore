{{- if .Values.grafana.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "densecore.fullname" . }}-grafana-dashboards
  labels:
    {{- include "densecore.labels" . | nindent 4 }}
    {{- with .Values.grafana.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafana.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  densecore-overview.json: |
{{ .Files.Get "dashboards/densecore-overview.json" | indent 4 }}
  densecore-inference.json: |
{{ .Files.Get "dashboards/densecore-inference.json" | indent 4 }}
{{- end }}
