apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: densecore-operator-manager-role
  labels:
    app.kubernetes.io/name: densecore-operator
    app.kubernetes.io/component: rbac
rules:
  # DenseCoreModel resources
  - apiGroups:
      - densecore.io
    resources:
      - densecoremodels
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - densecore.io
    resources:
      - densecoremodels/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - densecore.io
    resources:
      - densecoremodels/finalizers
    verbs:
      - update

  # Deployments
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Services
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # HPA
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Secrets (read only for HF token)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch

  # ConfigMaps
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
