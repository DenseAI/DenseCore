apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: densecoremodels.densecore.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
  labels:
    app.kubernetes.io/name: densecore-operator
    app.kubernetes.io/component: crd
spec:
  group: densecore.io
  names:
    kind: DenseCoreModel
    listKind: DenseCoreModelList
    plural: densecoremodels
    singular: densecoremodel
    shortNames:
      - dcm
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
          description: Current phase
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
          description: Ready replicas
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
          description: Service endpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.readyReplicas
      schema:
        openAPIV3Schema:
          type: object
          description: DenseCoreModel is the Schema for the densecoremodels API
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - model
              properties:
                model:
                  type: object
                  required:
                    - repoId
                    - filename
                  properties:
                    repoId:
                      type: string
                      description: HuggingFace repository ID
                    filename:
                      type: string
                      description: Model filename within the repository
                    hfTokenSecretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: HF_TOKEN
                    threads:
                      type: integer
                      minimum: 1
                      default: 4
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                autoscaling:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    minReplicas:
                      type: integer
                      minimum: 1
                      default: 1
                    maxReplicas:
                      type: integer
                      minimum: 1
                      default: 5
                    targetCPUUtilization:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 70
                    targetMemoryUtilization:
                      type: integer
                      minimum: 1
                      maximum: 100
                service:
                  type: object
                  properties:
                    grpcEnabled:
                      type: boolean
                      default: true
                    type:
                      type: string
                      enum: [ClusterIP, LoadBalancer, NodePort]
                      default: ClusterIP
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 8080
                    grpcPort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 50051
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                env:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                tolerations:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                affinity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                image:
                  type: string
                imagePullPolicy:
                  type: string
                  enum: [Always, IfNotPresent, Never]
                  default: IfNotPresent
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Downloading, Loading, Running, Failed]
                readyReplicas:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                loadProgress:
                  type: integer
                  minimum: 0
                  maximum: 100
                endpoint:
                  type: string
                grpcEndpoint:
                  type: string
                lastUpdated:
                  type: string
                  format: date-time
                message:
                  type: string
                observedGeneration:
                  type: integer
