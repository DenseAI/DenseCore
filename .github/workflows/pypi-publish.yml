name: Build Python Beta Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Manual Python package target'
        required: true
        type: choice
        default: build-only
        options:
          - build-only
          - testpypi

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: "x86_64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check package version metadata
        run: bash scripts/check_version_consistency.sh 0.1.0

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BEFORE_ALL_LINUX: |
            if command -v yum >/dev/null 2>&1; then yum install -y cmake gcc-c++ make numactl-devel hwloc-devel; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y cmake g++ make libnuma-dev libhwloc-dev; fi
          CIBW_BEFORE_BUILD: "pip install cmake ninja setuptools wheel"
          CIBW_ENVIRONMENT: |
            CMAKE_BUILD_TYPE=Release
          CIBW_TEST_COMMAND: "python -c \"import densecore; print('DenseCore import OK')\""
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
        with:
          package-dir: python
          output-dir: wheelhouse

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          pip install build
          cd python && python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: python/dist/*.tar.gz

  publish_testpypi:
    name: Publish beta artifacts to TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    permissions:
      id-token: write
    environment:
      name: testpypi

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: List distribution files
        run: ls -la dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
