name: Code Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Python format check
        run: make format-check-python

      - name: Run Python lint
        run: make lint-python

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build C++ library for Go analysis
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release -DDENSECORE_BUILD_TESTS=OFF -DDENSECORE_USE_MIMALLOC=OFF
          cmake --build core/build --target densecore -j$(nproc)

      - name: Run Go format check
        run: make format-check-go

      - name: Run Go lint
        run: make lint-go

  cpp-lint:
    name: C++ Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run C++ format check
        run: make format-check-cpp
